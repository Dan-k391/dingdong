name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['android-v*']
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the build commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle
            android/gradle.properties
            android/gradle/wrapper/gradle-wrapper.properties
      - name: Verify the pinned Gradle wrapper and release version
        run: |
          echo '498495120a03b9a6ab5d155f5de3c8f0d986a449153702fb80fc80e134484f17  android/gradle/wrapper/gradle-wrapper.jar' | sha256sum --check --strict
          chmod +x android/gradlew
          if [[ "$GITHUB_REF" == refs/tags/android-v* ]]; then
            version=$(sed -n 's/^dingdongVersionName=//p' android/gradle.properties)
            [[ "$GITHUB_REF_NAME" == "android-v$version" ]] || { echo 'The Android tag must match dingdongVersionName.' >&2; exit 1; }
          fi
      # The signing key lives only in this repository's Actions secrets. Without it the build is unsigned
      # (and cannot be installed); a release tag refuses to continue rather than publish that.
      - name: Load the release signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.DINGDONG_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dingdong-android.jks"
            echo "keystore=$RUNNER_TEMP/dingdong-android.jks" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/android-v* ]]; then
            echo 'An Android release needs the signing secrets (DINGDONG_ANDROID_KEYSTORE_BASE64, _KEY_ALIAS, _STORE_PASSWORD, _KEY_PASSWORD).' >&2
            exit 1
          fi
      - name: Build and lint the APK
        working-directory: android
        env:
          DINGDONG_ANDROID_KEYSTORE: ${{ steps.signing.outputs.keystore }}
          DINGDONG_ANDROID_KEY_ALIAS: ${{ secrets.DINGDONG_ANDROID_KEY_ALIAS }}
          DINGDONG_ANDROID_STORE_PASSWORD: ${{ secrets.DINGDONG_ANDROID_STORE_PASSWORD }}
          DINGDONG_ANDROID_KEY_PASSWORD: ${{ secrets.DINGDONG_ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --console=plain assembleRelease lintRelease
      - name: Verify and collect the signed APK
        if: steps.signing.outputs.keystore != ''
        run: |
          mkdir -p dist/android
          cp android/app/build/outputs/apk/release/app-release.apk dist/android/DingDong-Android.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 dist/android/DingDong-Android.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/android/DingDong-Android.apk
          rm -f "$RUNNER_TEMP/dingdong-android.jks"
          cd dist/android
          sha256sum DingDong-Android.apk > SHA256SUMS.txt
      - name: Upload the signed APK
        if: steps.signing.outputs.keystore != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: DingDong-Android
          path: |
            dist/android/DingDong-Android.apk
            dist/android/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Prepare the build for local signing
        if: steps.signing.outputs.keystore == ''
        run: |
          mkdir -p dist/android
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk dist/android/DingDong-Android-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" dist/android/apksigner.jar
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 dist/android/DingDong-Android-unsigned.apk
          cd dist/android
          sha256sum DingDong-Android-unsigned.apk apksigner.jar > SHA256SUMS-unsigned.txt
      - name: Upload the unsigned build and public signing tool
        if: steps.signing.outputs.keystore == ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: DingDong-Android-unsigned
          path: |
            dist/android/DingDong-Android-unsigned.apk
            dist/android/apksigner.jar
            dist/android/SHA256SUMS-unsigned.txt
          if-no-files-found: error
          retention-days: 30
      - name: Upload lint diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Android-lint
          path: android/app/build/reports/lint-results-release.*
          if-no-files-found: ignore
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/android-v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the signed APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: DingDong-Android
          path: dist
      - name: Publish the Android tag in this repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          assets=(dist/DingDong-Android.apk dist/SHA256SUMS.txt)
          for asset in "${assets[@]}"; do [[ -f "$asset" ]] || { echo "Missing release asset: $asset" >&2; exit 1; }; done
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag --title "叮咚 for Android $tag" --generate-notes
          fi
