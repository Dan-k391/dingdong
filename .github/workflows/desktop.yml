name: Build Windows desktop

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the build commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Check the release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $version = (Get-Content -Raw desktop/package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "The tag $env:GITHUB_REF_NAME must match desktop/package.json version $version."
          }
      - name: Install locked desktop dependencies
        working-directory: desktop
        run: npm ci --no-audit --no-fund
      - name: Package the Windows client
        working-directory: desktop
        run: npm run build:win
      - name: Write download checksums
        run: |
          $assets = @('DingDong.exe', 'DingDong-Setup.exe', 'DingDong-Windows.zip')
          $checksums = foreach ($asset in $assets) {
            $path = Join-Path 'dist' $asset
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing packaged asset: $asset"
            }
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $asset"
          }
          $checksums | Set-Content -LiteralPath dist/SHA256SUMS.txt -Encoding ascii
      - name: Upload Windows downloads
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: DingDong-Windows
          path: |
            dist/DingDong.exe
            dist/DingDong-Setup.exe
            dist/DingDong-Windows.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    # The Android publisher adds its APK to the same release; one at a time keeps SHA256SUMS.txt whole.
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - name: Download the packaged build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: DingDong-Windows
          path: dist
      - name: Publish the Windows files to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          own='DingDong\.exe|DingDong-Setup\.exe|DingDong-Windows\.zip'
          for asset in dist/DingDong.exe dist/DingDong-Setup.exe dist/DingDong-Windows.zip dist/SHA256SUMS.txt; do
            [[ -f "$asset" ]] || { echo "Missing release asset: $asset" >&2; exit 1; }
          done
          : > previous.txt
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            exists=1
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS.txt --output previous.txt --clobber 2> /dev/null || : > previous.txt
          else
            exists=0
          fi
          { tr -d '\r' < previous.txt | grep -Ev "  ($own)$" || true; tr -d '\r' < dist/SHA256SUMS.txt; } | sort -k2 > checksums.txt
          mv checksums.txt dist/SHA256SUMS.txt
          assets=(dist/DingDong.exe dist/DingDong-Setup.exe dist/DingDong-Windows.zip dist/SHA256SUMS.txt)
          if [[ $exists == 1 ]]; then
            gh release upload "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag --title "叮咚 $TAG" --generate-notes
          fi
